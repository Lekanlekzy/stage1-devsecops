name: Reusable workflow regression

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read


jobs:
  python-consumer:
    name: Python consumer regression
    if: >-
      ${{ github.event_name != 'pull_request'
          || (github.event.pull_request.head.repo.full_name == github.repository
              && github.actor != 'dependabot[bot]'
              && (github.event.action != 'closed' || github.event.pull_request.merged == true)) }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
      packages: write
    uses: ./.github/workflows/reusable-app-ci.yml
    with:
      language: python
      working_directory: tests/consumer-repo/python-app
      python_version: '3.12'
      sonar_project_key: Lekanlekzy_stage1-devsecops
      run_container_checks: true
      container_context: tests/consumer-repo/python-app
      publish_image: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


name: Central reusable application CD

on:
  workflow_call:
    inputs:
      app_package_artifact_id:
        description: Package artifact ID returned by successful CI in this workflow run.
        required: true
        type: string
      app_package_sha256:
        description: SHA-256 returned by successful CI for app.zip.
        required: true
        type: string
      app_revision:
        description: Commit returned by successful CI; must match this workflow run.
        required: true
        type: string
      azure_webapp_name:
        description: Existing non-production Azure App Service name.
        required: true
        type: string
      azure_client_id:
        description: Client ID of the Azure identity federated with the caller's non-production environment.
        required: true
        type: string
      azure_tenant_id:
        description: Azure tenant ID.
        required: true
        type: string
      azure_subscription_id:
        description: Azure subscription ID.
        required: true
        type: string
      health_check_path:
        description: Public JSON health endpoint returning status ok and the deployed revision.
        required: false
        type: string
        default: /healthz
    outputs:
      deployment_url:
        description: Application URL after successful deployment and health verification.
        value: ${{ jobs.deploy.outputs.url }}

permissions: {}

jobs:
  deploy:
    name: Deploy and verify non-production application
    if: >-
      ${{ github.event_name == 'pull_request'
          && github.event.action == 'closed'
          && github.event.pull_request.merged == true
          && github.event.repository.default_branch != ''
          && github.event.pull_request.base.ref == github.event.repository.default_branch
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          && github.sha == github.event.pull_request.merge_commit_sha
          && github.repository == github.event.repository.full_name
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.repository.fork != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
    environment:
      name: non-production
      url: ${{ steps.webapp.outputs.webapp-url }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.azure_webapp_name }}
      cancel-in-progress: false
    outputs:
      url: ${{ steps.health.outcome == 'success' && steps.webapp.outputs.webapp-url || '' }}
    steps:
      - name: Validate deployment configuration
        shell: python
        env:
          APP_PACKAGE_ARTIFACT_ID: ${{ inputs.app_package_artifact_id }}
          APP_PACKAGE_SHA256: ${{ inputs.app_package_sha256 }}
          APP_REVISION: ${{ inputs.app_revision }}
          AZURE_WEBAPP_NAME: ${{ inputs.azure_webapp_name }}
          AZURE_CLIENT_ID: ${{ inputs.azure_client_id }}
          AZURE_TENANT_ID: ${{ inputs.azure_tenant_id }}
          AZURE_SUBSCRIPTION_ID: ${{ inputs.azure_subscription_id }}
          HEALTH_CHECK_PATH: ${{ inputs.health_check_path }}
        run: |
          import os
          import re

          if not re.fullmatch(r"[1-9][0-9]*", os.environ["APP_PACKAGE_ARTIFACT_ID"]):
              raise SystemExit("::error::app_package_artifact_id must identify one package artifact from CI in this run.")
          if not re.fullmatch(r"[0-9a-f]{64}", os.environ["APP_PACKAGE_SHA256"]):
              raise SystemExit("::error::app_package_sha256 must be the SHA-256 returned by successful CI.")
          revision = os.environ["APP_REVISION"]
          if not re.fullmatch(r"[0-9a-f]{40}", revision) or revision != os.environ["GITHUB_SHA"]:
              raise SystemExit("::error::app_revision must match this workflow run's commit.")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9-]{0,58}[A-Za-z0-9]", os.environ["AZURE_WEBAPP_NAME"]):
              raise SystemExit("::error::azure_webapp_name must identify an existing non-production App Service.")
          for name in ("AZURE_CLIENT_ID", "AZURE_TENANT_ID", "AZURE_SUBSCRIPTION_ID"):
              if not re.fullmatch(r"[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}", os.environ[name]):
                  raise SystemExit(f"::error::{name} must be configured as a UUID.")
          path = os.environ["HEALTH_CHECK_PATH"]
          if not re.fullmatch(r"/[A-Za-z0-9/_-]*", path) or path.startswith("//"):
              raise SystemExit("::error::health_check_path must be an absolute application path without a query string.")
      - name: Download the application package from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.app_package_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/app-release
      - name: Verify the application package identity
        shell: python
        env:
          EXPECTED_SHA256: ${{ inputs.app_package_sha256 }}
          EXPECTED_REVISION: ${{ inputs.app_revision }}
        run: |
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path

          package = Path(os.environ["RUNNER_TEMP"]) / "app-release" / "app.zip"
          with package.open("rb") as archive:
              digest = hashlib.file_digest(archive, "sha256").hexdigest()
          if digest != os.environ["EXPECTED_SHA256"]:
              raise SystemExit("::error::Application package checksum mismatch.")
          with zipfile.ZipFile(package) as archive:
              manifest = archive.getinfo("release.json")
              if manifest.file_size > 65536:
                  raise SystemExit("::error::Application release manifest is too large.")
              release = json.loads(archive.read(manifest))
          if not isinstance(release, dict) or release.get("revision") != os.environ["EXPECTED_REVISION"]:
              raise SystemExit("::error::Application package revision mismatch.")
      - name: Authenticate to Azure with the caller's federated identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ inputs.azure_client_id }}
          tenant-id: ${{ inputs.azure_tenant_id }}
          subscription-id: ${{ inputs.azure_subscription_id }}
      - name: Deploy the application package without rebuilding
        id: webapp
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ inputs.azure_webapp_name }}
          package: ${{ runner.temp }}/app-release/app.zip
      - name: Verify application health and the deployed revision
        id: health
        shell: python
        env:
          APP_URL: ${{ steps.webapp.outputs.webapp-url }}
          HEALTH_CHECK_PATH: ${{ inputs.health_check_path }}
          EXPECTED_REVISION: ${{ inputs.app_revision }}
        run: |
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          base = os.environ["APP_URL"].rstrip("/")
          parsed = urllib.parse.urlsplit(base)
          if parsed.scheme != "https" or not (parsed.hostname or "").endswith(".azurewebsites.net"):
              raise SystemExit("::error::Deployment did not return an HTTPS Azure App Service URL.")
          revision = os.environ["EXPECTED_REVISION"]
          deadline = time.monotonic() + 300
          while time.monotonic() < deadline:
              try:
                  request = urllib.request.Request(base + os.environ["HEALTH_CHECK_PATH"], headers={"Cache-Control": "no-cache"})
                  with urllib.request.urlopen(request, timeout=10) as response:
                      health = json.loads(response.read(65536))
                      if response.status != 200 or not isinstance(health, dict) or health.get("status") != "ok" or health.get("revision") != revision:
                          raise ValueError("health or deployed revision does not match")
                  with urllib.request.urlopen(base + "/", timeout=10) as response:
                      if response.status != 200 or not response.read(1024):
                          raise ValueError("home page is unavailable")
                  print(f"Application health and revision verified: {revision}")
                  with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
                      summary.write(f"## Non-production deployment\n\nURL: {base}\n\nRevision: `{revision}`\n\nHealth and home-page checks: passed\n")
                  break
              except (urllib.error.URLError, TimeoutError, ValueError):
                  print("Waiting for the expected application revision to become healthy...")
                  time.sleep(5)
          else:
              raise SystemExit("::error::Application did not pass health, revision, and home-page checks within 300 seconds.")


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stage1-regression-consumer"
version = "0.1.0"
description = "Small Python consumer used to regression-test the central workflow."
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.coverage.run]
relative_files = true
source = ["src"]
branch = true
